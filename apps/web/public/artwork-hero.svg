<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Monopoly Deal India">
  <title>Monopoly Deal India</title>
  <defs>
    <clipPath id="frame">
      <rect x="20" y="20" width="984" height="984" rx="200" ry="200" />
    </clipPath>

    <!-- Mini monuments used on the card faces. No fill attribute: they inherit
         the fill set on each <use>, so one shape serves every card colour. -->
    <g id="mini-gate">
      <path fill-rule="evenodd" d="M20,140 L20,44 C20,12 180,12 180,44 L180,140 Z M72,140 L72,82 C72,56 128,56 128,82 L128,140 Z" />
    </g>
    <g id="mini-palace">
      <path d="M8,140 L8,102 L34,102 L34,76 L60,76 L60,54 L86,54 L86,38 L100,20 L114,38 L114,54 L140,54 L140,76 L166,76 L166,102 L192,102 L192,140 Z" />
      <circle cx="100" cy="62" r="9" fill="#fffdf7" />
      <circle cx="73" cy="86" r="8" fill="#fffdf7" />
      <circle cx="127" cy="86" r="8" fill="#fffdf7" />
      <circle cx="46" cy="114" r="8" fill="#fffdf7" />
      <circle cx="100" cy="114" r="8" fill="#fffdf7" />
      <circle cx="154" cy="114" r="8" fill="#fffdf7" />
    </g>
    <g id="mini-buddha">
      <circle cx="100" cy="42" r="10" />
      <circle cx="100" cy="70" r="24" />
      <path d="M100,96 C72,98 57,122 54,150 L146,150 C143,122 128,98 100,96 Z" />
      <path d="M40,124 C46,158 154,158 160,124 C168,150 150,164 100,164 C50,164 32,150 40,124 Z" />
    </g>
    <g id="mini-palms">
      <path d="M62,150 C64,116 70,92 82,66 L94,70 C82,96 76,120 74,150 Z" />
      <path d="M88,62 C64,44 36,44 18,60 C40,56 62,60 84,74 Z" />
      <path d="M88,62 C74,36 50,20 26,20 C48,32 66,50 80,74 Z" />
      <path d="M88,62 C110,40 140,34 162,44 C138,44 114,54 94,74 Z" />
      <path d="M88,62 C104,36 128,20 152,20 C130,32 112,50 98,74 Z" />
      <path d="M136,150 C138,124 143,106 152,86 L162,90 C153,110 148,128 146,150 Z" />
      <path d="M157,84 C140,70 120,70 108,82 C124,78 140,80 154,92 Z" />
      <path d="M157,84 C170,66 190,58 200,62 C182,66 168,76 160,92 Z" />
    </g>

    <!-- One card face; the backdrop art and colour are supplied per instance. -->
    <g id="card-shape">
      <rect x="-125" y="-175" width="250" height="350" rx="28" ry="28" fill="#fffdf7" />
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1024" height="1024" fill="#fbf1e2" />

    <!-- Backdrop: pale monuments, painted back to front. -->
    <g opacity="0.95">
      <!-- Palms, far left -->
      <g fill="#a9dcc1">
        <path d="M120,700 C124,596 138,528 166,452 L192,462 C166,536 152,600 148,700 Z" />
        <path d="M178,444 C130,398 66,396 28,428 C74,420 122,432 168,468 Z" />
        <path d="M178,444 C150,376 98,338 44,336 C90,362 130,398 160,464 Z" />
        <path d="M178,444 C228,388 296,374 344,398 C290,396 236,420 192,468 Z" />
        <path d="M178,444 C212,378 264,340 318,338 C272,364 232,400 196,466 Z" />
      </g>

      <!-- Sanchi-style stupa, left of centre -->
      <g fill="#bcd6e8">
        <path d="M226,556 C226,462 300,392 386,392 C472,392 546,462 546,556 Z" />
        <rect x="216" y="556" width="340" height="24" rx="10" />
        <g fill="none" stroke="#fbf1e2" stroke-width="10">
          <path d="M256,556 C256,486 314,436 386,436 C458,436 516,486 516,556" />
          <path d="M290,556 C290,510 332,478 386,478 C440,478 482,510 482,556" />
        </g>
        <rect x="356" y="352" width="60" height="42" rx="8" />
        <rect x="378" y="316" width="16" height="40" rx="6" />
        <path d="M330,330 L442,330 L424,300 L348,300 Z" />
      </g>

      <!-- Small lilac palace, tucked behind the centre dome -->
      <g fill="#cbb8e9">
        <path d="M236,700 L236,556 L360,556 L360,700 Z" />
        <path d="M262,700 L262,624 C262,592 334,592 334,624 L334,700 Z" fill="#fbf1e2" />
        <path d="M264,556 C264,512 298,486 298,486 C298,486 332,512 332,556 Z" />
      </g>

      <!-- Gopuram, far right -->
      <g fill="#f2ce73">
        <path d="M858,700 L858,624 L1000,624 L1000,700 Z" />
        <path d="M868,624 L868,552 L990,552 L990,624 Z" />
        <path d="M878,552 L878,484 L980,484 L980,552 Z" />
        <path d="M888,484 L888,418 L970,418 L970,484 Z" />
        <path d="M898,418 L898,354 L960,354 L960,418 Z" />
        <path d="M890,354 L968,354 L968,326 L890,326 Z" />
        <g>
          <path d="M896,326 C896,306 907,294 907,294 C907,294 918,306 918,326 Z" />
          <path d="M918,326 C918,300 929,284 929,284 C929,284 940,300 940,326 Z" />
          <path d="M940,326 C940,306 951,294 951,294 C951,294 962,306 962,326 Z" />
        </g>
        <g fill="#fbf1e2" opacity="0.55">
          <rect x="900" y="646" width="18" height="42" rx="6" />
          <rect x="940" y="646" width="18" height="42" rx="6" />
          <rect x="906" y="574" width="16" height="34" rx="6" />
          <rect x="938" y="574" width="16" height="34" rx="6" />
        </g>
      </g>

      <!-- Seated Buddha, right of centre -->
      <g fill="#f3b393">
        <path d="M790,268 C790,252 800,242 800,242 C800,242 810,252 810,268 Z" />
        <circle cx="800" cy="330" r="50" />
        <path d="M800,388 C742,392 712,444 706,506 L894,506 C888,444 858,392 800,388 Z" />
        <path d="M690,478 C702,548 898,548 910,478 C926,536 890,562 800,562 C710,562 674,536 690,478 Z" />
        <path d="M704,580 C736,612 864,612 896,580 C878,624 722,624 704,580 Z" opacity="0.7" />
      </g>

      <!-- Taj-style centrepiece, deep magenta, front of the backdrop stack -->
      <g fill="#6e1f47">
        <path d="M425,452 C371,376 403,290 520,254 C637,290 669,376 615,452 Z" />
        <rect x="506" y="222" width="28" height="40" rx="8" />
        <circle cx="520" cy="212" r="14" />
        <circle cx="520" cy="184" r="9" />
        <rect x="514" y="150" width="12" height="30" rx="6" />
        <path d="M394,486 C378,448 390,414 418,398 C446,414 458,448 442,486 Z" />
        <path d="M598,486 C582,448 594,414 622,398 C650,414 662,448 646,486 Z" />
        <rect x="406" y="374" width="24" height="28" rx="6" />
        <rect x="610" y="374" width="24" height="28" rx="6" />
        <path d="M356,700 L356,470 L684,470 L684,700 Z" />
        <rect x="342" y="700" width="356" height="22" rx="6" />
        <path d="M472,700 L472,586 C472,532 568,532 568,586 L568,700 Z" fill="#fbf1e2" />
        <path d="M392,700 L392,624 C392,594 440,594 440,624 L440,700 Z" fill="#fbf1e2" />
        <path d="M600,700 L600,624 C600,594 648,594 648,624 L648,700 Z" fill="#fbf1e2" />
        <rect x="300" y="512" width="26" height="210" rx="12" />
        <path d="M300,512 C300,478 313,458 313,458 C313,458 326,478 326,512 Z" />
        <rect x="714" y="512" width="26" height="210" rx="12" />
        <path d="M714,512 C714,478 727,458 727,458 C727,458 740,478 740,512 Z" />
      </g>
    </g>

    <!-- Foreground: four fanned currency cards, bleeding off the bottom edge. -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle">
      <!-- ₹1Cr -->
      <g transform="translate(205 830) rotate(-14)">
        <use href="#card-shape" />
        <rect x="-125" y="-175" width="250" height="350" rx="28" ry="28" fill="none" stroke="#3b1673" stroke-width="14" />
        <text y="-84" font-size="62" fill="#3b1673">₹</text>
        <text y="-2" font-size="84" fill="#3b1673">1Cr</text>
        <line x1="-86" y1="34" x2="86" y2="34" stroke="#3b1673" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18" opacity="0.45" />
        <use href="#mini-gate" transform="translate(-75 52) scale(0.75)" fill="#3b1673" opacity="0.85" />
      </g>
      <!-- ₹4Cr -->
      <g transform="translate(808 832) rotate(14)">
        <use href="#card-shape" />
        <rect x="-125" y="-175" width="250" height="350" rx="28" ry="28" fill="none" stroke="#178c4e" stroke-width="14" />
        <text y="-84" font-size="62" fill="#178c4e">₹</text>
        <text y="-2" font-size="84" fill="#178c4e">4Cr</text>
        <line x1="-86" y1="34" x2="86" y2="34" stroke="#178c4e" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18" opacity="0.45" />
        <use href="#mini-palms" transform="translate(-75 46) scale(0.75)" fill="#178c4e" opacity="0.85" />
      </g>
      <!-- ₹3Cr -->
      <g transform="translate(607 802) rotate(6)">
        <use href="#card-shape" />
        <rect x="-125" y="-175" width="250" height="350" rx="28" ry="28" fill="none" stroke="#d35400" stroke-width="14" />
        <text y="-84" font-size="62" fill="#d35400">₹</text>
        <text y="-2" font-size="84" fill="#d35400">3Cr</text>
        <line x1="-86" y1="34" x2="86" y2="34" stroke="#d35400" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18" opacity="0.45" />
        <use href="#mini-buddha" transform="translate(-75 48) scale(0.75)" fill="#d35400" opacity="0.85" />
      </g>
      <!-- ₹2Cr -->
      <g transform="translate(405 798) rotate(-5)">
        <use href="#card-shape" />
        <rect x="-125" y="-175" width="250" height="350" rx="28" ry="28" fill="none" stroke="#b81a5c" stroke-width="14" />
        <text y="-84" font-size="62" fill="#b81a5c">₹</text>
        <text y="-2" font-size="84" fill="#b81a5c">2Cr</text>
        <line x1="-86" y1="34" x2="86" y2="34" stroke="#b81a5c" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18" opacity="0.45" />
        <use href="#mini-palace" transform="translate(-75 52) scale(0.75)" fill="#b81a5c" opacity="0.85" />
      </g>

      <!-- ₹3Cr -->
      <g transform="translate(607 802) rotate(6)">
        <use href="#card-shape" />
        <rect x="-125" y="-175" width="250" height="350" rx="28" ry="28" fill="none" stroke="#d35400" stroke-width="14" />
        <text y="-84" font-size="62" fill="#d35400">₹</text>
        <text y="-2" font-size="84" fill="#d35400">3Cr</text>
        <line x1="-86" y1="34" x2="86" y2="34" stroke="#d35400" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18" opacity="0.45" />
        <use href="#mini-buddha" transform="translate(-75 48) scale(0.75)" fill="#d35400" opacity="0.85" />
      </g>

      <!-- ₹4Cr -->
      <g transform="translate(808 832) rotate(14)">
        <use href="#card-shape" />
        <rect x="-125" y="-175" width="250" height="350" rx="28" ry="28" fill="none" stroke="#178c4e" stroke-width="14" />
        <text y="-84" font-size="62" fill="#178c4e">₹</text>
        <text y="-2" font-size="84" fill="#178c4e">4Cr</text>
        <line x1="-86" y1="34" x2="86" y2="34" stroke="#178c4e" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18" opacity="0.45" />
        <use href="#mini-palms" transform="translate(-75 46) scale(0.75)" fill="#178c4e" opacity="0.85" />
      </g>
    </g>
  </g>

  <rect x="20" y="20" width="984" height="984" rx="200" ry="200" fill="none" stroke="#b81a5c" stroke-width="40" />
</svg>
